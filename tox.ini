[tox]
requires =
    tox>=4.2
env_list =
    py314
    lint
    type

[testenv]
deps =
    .
extras =
    test
commands =
    pytest {posargs}

[testenv:lint]
deps =
    .
extras =
    lint
commands =
    black --check --diff --color .
    isort --check --diff --color .

[testenv:type]
deps =
    .
extras =
    type
commands =
    mypy --config-file mypy.ini glsamaker

[gh-actions]
python =
    3.14: py314, lint, type
